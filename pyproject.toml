[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  | model_cache
  | \.venv
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["model_cache", ".venv", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
omit = ["src/ui.py", "src/__init__.py"]
