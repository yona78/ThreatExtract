[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "threatextract"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  | model_cache
  | \.venv
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["model_cache", ".venv", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/fork1/run_experiment.py" = ["E501"]
"src/fork1/synthesis.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src --cov-report=term-missing --cov-fail-under=85"
pythonpath = ["src", "."]

[tool.coverage.run]
omit = ["src/ui.py", "src/__init__.py"]
