<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img">
<title>Accuracy and Deployment Tradeoffs</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="160" y="36" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827">Accuracy and Deployment Tradeoffs</text>
<text x="160" y="60" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">SecureBERT wins accuracy while also reducing resource burden in this run.</text>
<text x="146" y="118" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#111827">Exact F1</text>
<text x="146" y="137" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">higher is better</text>
<rect x="160" y="90" width="890.0" height="24" rx="4" fill="#2563eb"/>
<text x="1058.0" y="107" font-family="Arial, sans-serif" font-size="12" fill="#111827">SecureBERT-NER 0.282</text>
<rect x="160" y="124" width="330.1" height="24" rx="4" fill="#dc2626"/>
<text x="498.1" y="141" font-family="Arial, sans-serif" font-size="12" fill="#111827">CyNER 0.105</text>
<text x="146" y="223" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#111827">Elapsed seconds</text>
<text x="146" y="242" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">lower is better</text>
<rect x="160" y="195" width="784.1" height="24" rx="4" fill="#2563eb"/>
<text x="952.1" y="212" font-family="Arial, sans-serif" font-size="12" fill="#111827">SecureBERT-NER 24.140</text>
<rect x="160" y="229" width="890.0" height="24" rx="4" fill="#dc2626"/>
<text x="1058.0" y="246" font-family="Arial, sans-serif" font-size="12" fill="#111827">CyNER 27.400</text>
<text x="146" y="328" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#111827">RSS peak MB</text>
<text x="146" y="347" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">lower is better</text>
<rect x="160" y="300" width="762.6" height="24" rx="4" fill="#2563eb"/>
<text x="930.6" y="317" font-family="Arial, sans-serif" font-size="12" fill="#111827">SecureBERT-NER 812.766</text>
<rect x="160" y="334" width="890.0" height="24" rx="4" fill="#dc2626"/>
<text x="1058.0" y="351" font-family="Arial, sans-serif" font-size="12" fill="#111827">CyNER 948.531</text>
<text x="146" y="433" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#111827">Cache GB</text>
<text x="146" y="452" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">lower is better</text>
<rect x="160" y="405" width="788.6" height="24" rx="4" fill="#2563eb"/>
<text x="956.6" y="422" font-family="Arial, sans-serif" font-size="12" fill="#111827">SecureBERT-NER 0.996</text>
<rect x="160" y="439" width="890.0" height="24" rx="4" fill="#dc2626"/>
<text x="1058.0" y="456" font-family="Arial, sans-serif" font-size="12" fill="#111827">CyNER 1.124</text>
</svg>
